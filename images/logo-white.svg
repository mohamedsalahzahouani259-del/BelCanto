<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 125" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
